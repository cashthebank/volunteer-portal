name: goodvolunteer

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volunteer
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Kafka (KRaft mode, single node — no ZooKeeper) ─────────────────────
  # ZooKeeper was removed in Kafka 4.0, so we run a combined controller+broker
  # in KRaft mode.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the volunteer-events topic with 3 partitions, then exits.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic volunteer-events --partitions 3 --replication-factor 1
        echo "Topic ready:" && kafka-topics --bootstrap-server kafka:9092 --describe --topic volunteer-events

  # ─── Kafka exporter (broker health + consumer lag) ──────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command: ["--kafka.server=kafka:9092", "--group.filter=volunteer-consumers"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Flask API (producer + /metrics) ────────────────────────────────────
  api:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: volunteer
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: volunteer-events
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Consumer (idempotent aggregator + /metrics) ────────────────────────
  consumer:
    build: ./consumer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: volunteer
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: volunteer-events
      KAFKA_GROUP: volunteer-consumers
      METRICS_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # ─── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ─── Frontend (React, served by nginx) ──────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  # ─── Locust load generator ──────────────────────────────────────────────
  locust:
    build: ./load-generator
    ports:
      - "8089:8089"
    depends_on:
      - api

volumes:
  pgdata:
  kafkadata:
