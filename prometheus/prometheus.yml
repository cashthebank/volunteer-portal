global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'flask-api'
    static_configs:
      - targets: ['api:5000']

  - job_name: 'consumer'
    static_configs:
      - targets: ['consumer:8001']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
